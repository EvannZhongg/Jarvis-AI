[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-agent"
version = "0.1.0"
description = "A minimal multi-turn AI agent."
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
gui = ["fastapi>=0.115", "uvicorn>=0.30", "websockets>=13"]

[project.scripts]
jarvis = "agent_cli.cli:main"
jarvis-gui = "agent_gui.server:main"

[tool.setuptools.packages.find]
include = ["agent_core*", "agent_cli*", "agent_gui*"]

[tool.setuptools.package-data]
agent_core = ["prompts/*.md", "defaults/*.json"]
agent_gui = ["static/*", "static/assets/*"]
