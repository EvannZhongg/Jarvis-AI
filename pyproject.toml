[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-agent"
version = "0.1.0"
description = "A minimal multi-turn AI agent."
requires-python = ">=3.11"
dependencies = [
    "exa-py>=2.0",
    "litellm>=1.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
gui = ["fastapi>=0.115", "uvicorn>=0.30", "websockets>=13"]

[project.scripts]
jarvis = "interfaces.launch:main"
jarvis-gui = "interfaces.gui.server:main"

[tool.setuptools.packages.find]
include = ["agent_core*", "interfaces*"]

[tool.setuptools.package-data]
agent_core = ["prompts/*.md"]
"interfaces" = ["tui/dist/app.js"]
"interfaces.bridge" = ["defaults/*.json"]
"interfaces.gui" = ["static/*", "static/assets/*"]
